# -----------------------------------------------------------------------------
# Continuous integration: runs on every push and every pull request.
#
# Three gates, the same ones every developer inspired by this template should
# keep:
#   1. Prettier  -> consistent formatting (no style debates in reviews);
#   2. ESLint    -> catch real mistakes (undefined vars, dead code, ...);
#   3. Tests     -> `node --test`, the built-in runner (no extra dependency).
#
# Runs on Node 24, the version the Docker image ships with (see the Dockerfile),
# so the check exercises the exact runtime the integration runs on.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The portal has no API: part of the suite drives a real browser against
      # a stand-in portal (test/helpers/fakePortal.js). Without a Chromium those
      # tests silently skip, and the fragile half of the integration would go
      # unchecked on every pull request.
      - name: Install Chromium
        run: npx playwright-core install --with-deps --no-shell chromium

      # Same check the Docker build runs: the browser the code asks for must be
      # the one that got installed. Cheap here, and it catches the packaging
      # mistake before anyone waits for an image.
      - name: Check the browser is the one the code asks for
        run: npm run check:browser

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test
